<!DOCTYPE html>
<html>
    <head>
        <title>Лабораторна 3_3</title>
    </head>
    <body>
        <h1>Тип розрахунку</h1>
        <form action="https://www.w3schools.com/action_page.php" method="get" target="result">
            <fieldset>
                <legend>Оберіть вид розрахунку:</legend>
                <input type="radio" id="cash" name="payment" value="Готівка">
                <label for="cash">Готівка</label><br>
                <input type="radio" id="visa" name="payment" value="Visa">
                <label for="visa">Visa</label><br>
                <input type="radio" id="mastercard" name="payment" value="MasterCard">
                <label for="mastercard">MasterCard</label><br>
                <input type="radio" id="amex" name="payment" value="American Express">
                <label for="amex">American Express</label><br><br>
                <button type="submit">Зробити вибір</button>
            </fieldset>
        </form>
    </body>
</html>
