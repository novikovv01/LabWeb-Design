<!DOCTYPE html>
<html>
    <head>
        <title>Лабораторна 3_2</title>
    </head>
    <body>
        <h1>З якими операційними системами довелося працювати:</h1>
        <form action="https://www.w3schools.com/action_page.php" method="get" target="result">
            <fieldset>
                <legend>З якими операційними системами довелося працювати:</legend>
                <input type="checkbox" id="os1" name="os1" value="Windows">
                <label for="os1">Windows</label><br>
                <input type="checkbox" id="os2" name="os2" value="Linux">
                <label for="os2">Linux</label><br>
                <input type="checkbox" id="os3" name="os3" value="MacOS"> 
                <label for="os3">MacOS</label><br>
                <input type="checkbox" id="os4" name="os4" value="Solaris">
                <label for="os4">Solaris</label><br>
                <input type="checkbox" id="os5" name="os5" value="FreeDOS">
                <label for="os5">FreeDOS</label><br>
                <input type="checkbox" id="os6" name="os6" value="Android">
                <label for="os6">Android</label><br>
                <input type="checkbox" id="os7" name="os7" value="iOS">
                <label for="os7">iOS</label><br>
                <input type="checkbox" id="os8" name="os8" value="QNX">
                <label for="os8">QNX</label><br><br>
                <button type="submit">Відправити</button>
            </fieldset>
        </form>
    </body>
</html>
